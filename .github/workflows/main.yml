name: تحديث المحتوى تلقائيًا 2

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "المهام: news,catalog,anime-characters,characters,wallpapers,digest"
        default: "news,catalog,anime-characters,characters,wallpapers,digest"
        required: false

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # قيمة موحّدة تُستخدم في كل الخطوات لتجنّب الهشاشة
  FULL_JOBS: "news,catalog,anime-characters,characters,wallpapers,digest"
  JOBS: ${{ inputs.jobs || 'news,catalog,anime-characters,characters,wallpapers,digest' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - run: npm ci

      - name: اختبارات الأتمتة
        run: npm test

      - name: تشغيل التحديث
        id: update
        run: npm run update 2>&1 | tee update.log
        shell: bash -o pipefail {0}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_VIDEOS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIDEOS }}
          NEWS_PER_RUN: "5"
          CHARACTERS_PER_RUN: "6"
          WALLPAPERS_PER_RUN: "6"
          CATALOG_SIZE: "150"
          NEW_ANIME_PER_RUN: "25"
          ANIME_CHARACTERS_PER_RUN: "5"

      - name: فتح Issue عند الفشل
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAIL=$(tail -n 60 update.log 2>/dev/null || echo "لا يوجد سجل")
          BODY=$(printf 'فشل التحديث التلقائي للمحتوى.\n\n**المهام المحددة:** %s\n**التشغيل:** %s\n**الوقت:** %s\n\n<details><summary>آخر سطور السجل</summary>\n\n```\n%s\n```\n</details>\n\nلن يُغلق التقرير إلا بعد نجاح مجموعة المهام كاملة.' "$JOBS" "$RUN_URL" "$(date -u +'%Y-%m-%d %H:%M UTC')" "$TAIL")
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label auto-update-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh label create auto-update-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "فشل التحديث التلقائي" --force
            gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ فشل التحديث التلقائي للمحتوى" --label auto-update-failure --body "$BODY"
          fi

      - name: تنبيه Telegram عند الفشل (اختياري)
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE=$(printf '⚠️ <b>ChicAnime</b>: فشل التحديث التلقائي للمحتوى.\n%s' "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}" > /dev/null

      - name: إغلاق تقارير الفشل بعد نجاح المجموعة كاملة فقط
        if: success() && (github.event_name == 'schedule' || inputs.jobs == '' || inputs.jobs == env.FULL_JOBS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label auto-update-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "نجحت جميع مهام التحديث المحددة في التشغيل الكامل وتم إنهاء خطوة التحديث دون أخطاء. راجع سجل التشغيل للتفاصيل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
